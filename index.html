<!DOCTYPE html>
<html lang="pt-BR" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roteirização CWB • Consulta Rápida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-900 text-slate-100 antialiased">

    <!-- Compact Header -->
    <header class="sticky top-0 z-30 glass-panel border-b border-slate-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 sm:px-6">
            <div class="flex items-center justify-between h-12 sm:h-14">
                <!-- Logo / Title -->
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-sm">
                        <i class="fa-solid fa-plane-departure text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-white leading-none">
                            Roteirização CWB
                        </h1>
                        <p class="text-[10px] text-slate-400 leading-tight mt-0.5">
                            Consulta de Siglas & Destinos
                        </p>
                    </div>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center gap-1.5 sm:gap-2">
                    <button id="soundToggleBtn" onclick="toggleSound()" title="Som e Vibração" class="w-8 h-8 rounded-lg bg-slate-800 text-amber-400 border border-slate-700 hover:bg-slate-700 transition-all flex items-center justify-center text-xs">
                        <i id="soundIcon" class="fa-solid fa-volume-high"></i>
                    </button>
                    <button id="viewListBtn" onclick="openModal()" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-blue-950/80 text-blue-400 border border-blue-800/70 hover:bg-blue-900/60 transition-all flex items-center gap-1.5">
                        <i class="fa-solid fa-table-list"></i>
                        <span>Tabela</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 py-3 sm:py-5 space-y-3 sm:space-y-4">

        <!-- Compact Search Banner Section -->
        <div class="relative bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 rounded-2xl p-3.5 sm:p-5 text-white shadow-lg border border-slate-800 overflow-hidden">
            <div class="relative z-10 max-w-2xl mx-auto text-center space-y-2.5">
                
                <h2 class="text-base sm:text-xl font-extrabold tracking-tight">
                    Para onde vai a sigla?
                </h2>

                <!-- Search Input Box -->
                <div class="relative max-w-xl mx-auto">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-sm sm:text-base"></i>
                    </div>
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="Ex: NAT, REC, CGB, AJU..." 
                        autocomplete="off"
                        autofocus
                        onfocus="this.select()"
                        class="w-full pl-10 pr-10 py-2.5 sm:py-3.5 rounded-xl bg-slate-800 text-white placeholder-slate-400 text-base sm:text-lg font-extrabold border-2 border-slate-700 focus:border-blue-500 focus:outline-none shadow-inner transition-all uppercase"
                        oninput="handleSearch()"
                    >
                    <button 
                        id="clearSearchBtn" 
                        onclick="clearSearch()"
                        class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors"
                    >
                        <i class="fa-solid fa-circle-xmark text-base"></i>
                    </button>
                </div>

                <!-- Auto-Clear & Recent Searches -->
                <div class="max-w-xl mx-auto flex flex-wrap items-center justify-between gap-1.5 text-[11px] text-slate-300">
                    <label class="inline-flex items-center gap-1.5 cursor-pointer select-none bg-white/10 hover:bg-white/15 px-2.5 py-1 rounded-lg">
                        <input type="checkbox" id="autoSelectToggle" checked class="w-3.5 h-3.5 rounded text-blue-500 focus:ring-0 bg-slate-800 border-slate-600">
                        <span>Bipagem rápida (3 letras)</span>
                    </label>

                    <div id="recentSearchesContainer" class="hidden flex items-center gap-1 flex-wrap">
                        <span class="text-slate-400 text-[10px]"><i class="fa-solid fa-clock-rotate-left"></i></span>
                        <div id="recentSearchesList" class="flex items-center gap-1"></div>
                    </div>
                </div>

                <!-- Quick Highlight Box for Direct Exact Matches -->
                <div id="quickResultCard" class="hidden max-w-xl mx-auto mt-2 p-3 sm:p-4 rounded-xl text-white shadow-xl text-left border-2 transition-all duration-200">
                    <!-- Populated dynamically when user searches a sigla -->
                </div>
            </div>
        </div>

        <!-- Compact Filters & Stats Bar -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 bg-slate-800/80 p-2.5 sm:p-3 rounded-xl border border-slate-700/80">
            
            <!-- Hub Pills Filter -->
            <div class="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0 custom-scrollbar">
                <button onclick="setHubFilter('ALL')" id="filter-hub-ALL" class="hub-filter-btn active px-2.5 py-1 text-[11px] font-bold rounded-lg whitespace-nowrap transition-all bg-blue-600 text-white">
                    Todos
                </button>
                <button onclick="setHubFilter('GRU')" id="filter-hub-GRU" class="hub-filter-btn px-2.5 py-1 text-[11px] font-bold rounded-lg whitespace-nowrap transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                    GRU
                </button>
                <button onclick="setHubFilter('CGH')" id="filter-hub-CGH" class="hub-filter-btn px-2.5 py-1 text-[11px] font-bold rounded-lg whitespace-nowrap transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                    CGH
                </button>
                <button onclick="setHubFilter('POA')" id="filter-hub-POA" class="hub-filter-btn px-2.5 py-1 text-[11px] font-bold rounded-lg whitespace-nowrap transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                    POA
                </button>
                <button onclick="setHubFilter('CNF')" id="filter-hub-CNF" class="hub-filter-btn px-2.5 py-1 text-[11px] font-bold rounded-lg whitespace-nowrap transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                    CNF
                </button>
                <button onclick="setHubFilter('VCP')" id="filter-hub-VCP" class="hub-filter-btn px-2.5 py-1 text-[11px] font-bold rounded-lg whitespace-nowrap transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
                    VCP
                </button>
            </div>

            <!-- Stats & Select State -->
            <div class="flex items-center justify-between sm:justify-end gap-2 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-700/80">
                <div class="text-[11px] font-medium text-slate-400 whitespace-nowrap">
                    Exibindo: <strong id="resultsCount" class="text-blue-400 font-bold">0</strong>
                </div>

                <!-- State Dropdown -->
                <select id="stateSelect" onchange="handleSearch()" class="px-2.5 py-1 rounded-lg bg-slate-700 text-slate-200 text-[11px] font-bold border border-slate-600 focus:outline-none focus:ring-1 focus:ring-blue-500 max-w-[175px]">
                    <option value="ALL">Todos Estados</option>
                </select>
            </div>

        </div>

        <!-- Compact Results Grid Container -->
        <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2.5 sm:gap-3.5">
            <!-- Cards populated dynamically via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-8 px-4 bg-slate-800/50 rounded-2xl border border-dashed border-slate-700">
            <div class="w-11 h-11 mx-auto mb-2.5 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-base">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <h3 class="text-sm sm:text-base font-bold text-white mb-1">Nenhuma sigla encontrada</h3>
            <p class="text-xs text-slate-400 max-w-xs mx-auto mb-3">
                Nenhum destino para "<span id="emptySearchTerm" class="font-semibold text-slate-300"></span>".
            </p>
            <button onclick="clearSearch()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition-all">
                Limpar Filtros
            </button>
        </div>

    </main>

    <!-- Compact Footer -->
    <footer class="mt-auto border-t border-slate-800 bg-slate-900 py-2.5 text-center text-[11px] text-slate-500">
        <div class="max-w-7xl mx-auto px-3">
            <strong>Roteirização CWB</strong> &bull; Guarulhos, Congonhas, Porto Alegre, Confins e Campinas
        </div>
    </footer>

    <!-- Modal: View Full Original Roteirização Lists -->
    <div id="listModal" class="fixed inset-0 z-50 hidden bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-2.5 sm:p-4">
        <div class="bg-slate-800 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-700 overflow-hidden">
            <!-- Modal Header -->
            <div class="p-3.5 sm:p-4 border-b border-slate-700 flex items-center justify-between bg-slate-800">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center text-sm">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>
                    <div>
                        <h3 class="text-sm sm:text-base font-bold text-white leading-tight">Tabela Roteirização CWB</h3>
                        <p class="text-[11px] text-slate-400">Toque em uma sigla para consultar</p>
                    </div>
                </div>
                <button onclick="closeModal()" class="p-1.5 text-slate-400 hover:text-slate-200 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Content (Scrollable) -->
            <div class="p-3.5 sm:p-5 overflow-y-auto space-y-4 custom-scrollbar text-xs sm:text-sm" id="modalGroupContent">
                <!-- Content generated dynamically -->
            </div>

            <!-- Modal Footer -->
            <div class="p-3 border-t border-slate-700 bg-slate-800 text-right">
                <button onclick="closeModal()" class="px-4 py-1.5 bg-slate-700 text-white font-semibold text-xs rounded-lg hover:bg-slate-600 transition-colors">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white px-3.5 py-2.5 rounded-xl shadow-xl flex items-center justify-center sm:justify-start gap-2 border border-slate-700 text-xs font-medium">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toastMessage">Copiado!</span>
    </div>

            { code: "JJG", city: "Jaguaruna", state: "Santa Catarina", uf: "SC", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Sul" },

            { code: "NVT", city: "Navegantes", state: "Santa Catarina", uf: "SC", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Sul" },
            { code: "PFB", city: "Passo Fundo", state: "Rio Grande do Sul", uf: "RS", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Sul" },
            { code: "PMG", city: "Ponta Porã", state: "Mato Grosso do Sul", uf: "MS", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Centro-Oeste" },

            { code: "SSA", city: "Salvador", state: "Bahia", uf: "BA", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Nordeste" },
            { code: "ROO", city: "Rondonópolis", state: "Mato Grosso", uf: "MT", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Centro-Oeste" },
            { code: "RVD", city: "Rio Verde", state: "Goiás", uf: "GO", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Centro-Oeste" },
            { code: "CGR", city: "Campo Grande", state: "Mato Grosso do Sul", uf: "MS", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Centro-Oeste" },
            { code: "DOU", city: "Dourados", state: "Mato Grosso do Sul", uf: "MS", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Centro-Oeste" },
            { code: "OPS", city: "Sinop", state: "Mato Grosso", uf: "MT", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Centro-Oeste" },
            { code: "XAP", city: "Chapecó", state: "Santa Catarina", uf: "SC", hub: "CAMPINAS – VCP", hubCode: "VCP", region: "Sul" },

            // --- HUBS ---
            { code: "GRU", city: "Guarulhos", state: "São Paulo", uf: "SP", hub: "HUB PRINCIPAL", hubCode: "GRU", region: "Sudeste" },
            { code: "CGH", city: "Congonhas", state: "São Paulo", uf: "SP", hub: "HUB PRINCIPAL", hubCode: "CGH", region: "Sudeste" },
            { code: "POA", city: "Porto Alegre", state: "Rio Grande do Sul", uf: "RS", hub: "HUB PRINCIPAL", hubCode: "POA", region: "Sul" },
            { code: "CNF", city: "Confins (Belo Horizonte)", state: "Minas Gerais", uf: "MG", hub: "HUB PRINCIPAL", hubCode: "CNF", region: "Sudeste" },
            { code: "VCP", city: "Campinas (Viracopos)", state: "São Paulo", uf: "SP", hub: "HUB PRINCIPAL", hubCode: "VCP", region: "Sudeste" },
            { code: "CWB", city: "Curitiba (Origem Roteirização)", state: "Paraná", uf: "PR", hub: "ORIGEM CWB", hubCode: "CWB", region: "Sul" }
        ];

        const HUB_BANNER_STYLES = {
            "GRU": "bg-gradient-to-r from-emerald-600 to-teal-700 border-emerald-400/50",
            "CGH": "bg-gradient-to-r from-blue-600 to-indigo-700 border-blue-400/50",
            "POA": "bg-gradient-to-r from-amber-600 to-orange-700 border-amber-400/50",
            "CNF": "bg-gradient-to-r from-purple-600 to-fuchsia-700 border-purple-400/50",
            "VCP": "bg-gradient-to-r from-rose-600 to-red-700 border-rose-400/50",
            "CWB": "bg-gradient-to-r from-cyan-600 to-blue-700 border-cyan-400/50"
        };

        const HUB_COLORS = {
            "GRU": "bg-emerald-950/90 text-emerald-300 border-emerald-800",
            "CGH": "bg-indigo-950/90 text-indigo-300 border-indigo-800",
            "POA": "bg-amber-950/90 text-amber-300 border-amber-800",
            "CNF": "bg-purple-950/90 text-purple-300 border-purple-800",
            "VCP": "bg-rose-950/90 text-rose-300 border-rose-800",
            "CWB": "bg-blue-950/90 text-blue-300 border-blue-800"
        };

        let selectedHub = "ALL";
        let soundEnabled = true;
        let recentSearches = [];
        let lastAnnouncedCode = "";

        function playFeedback(type) {
            if (!soundEnabled) return;
            if (navigator.vibrate) {
                if (type === 'success') navigator.vibrate(45);
                if (type === 'error') navigator.vibrate([80, 40, 80]);
            }
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.09);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(160, ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.19);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.19);
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = "fa-solid fa-volume-high text-amber-400";
                playFeedback('success');
                showCustomToast("Som e vibração ativados!");
            } else {
                icon.className = "fa-solid fa-volume-xmark text-slate-500";
                showCustomToast("Som e vibração desativados.");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            populateStateSelect();
            renderResults(ROUTING_DATA);
            buildModalContent();
            document.documentElement.classList.add('dark');
        });

        function populateStateSelect() {
            const stateSelect = document.getElementById('stateSelect');
            stateSelect.innerHTML = '<option value="ALL">Todos Estados</option>';
            const ufs = [...new Map(ROUTING_DATA.map(item => [item.uf, item.state])).entries()];
            ufs.sort((a, b) => a[0].localeCompare(b[0]));
            ufs.forEach(([uf, stateName]) => {
                const option = document.createElement('option');
                option.value = uf;
                option.textContent = `${uf} - ${stateName}`;
                stateSelect.appendChild(option);
            });
        }

        function setHubFilter(hubCode) {
            selectedHub = hubCode;
            document.querySelectorAll('.hub-filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-slate-700', 'text-slate-300');
            });

            const activeBtn = document.getElementById(`filter-hub-${hubCode}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-700', 'text-slate-300');
                activeBtn.classList.add('bg-blue-600', 'text-white');
            }

            handleSearch();
        }

        function setSearch(term) {
            const input = document.getElementById('searchInput');
            input.value = term;
            handleSearch();
            input.focus();
            if (document.getElementById('autoSelectToggle').checked) {
                input.select();
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('stateSelect').value = 'ALL';
            lastAnnouncedCode = "";
            setHubFilter('ALL');
            document.getElementById('searchInput').focus();
        }

        function addRecentSearch(code) {
            recentSearches = recentSearches.filter(c => c !== code);
            recentSearches.unshift(code);
            if (recentSearches.length > 4) recentSearches.pop();

            const container = document.getElementById('recentSearchesContainer');
            const list = document.getElementById('recentSearchesList');
            if (recentSearches.length > 0) {
                container.classList.remove('hidden');
                list.innerHTML = recentSearches.map(c => `
                    <button onclick="setSearch('${c}')" class="px-1.5 py-0.5 rounded bg-slate-800 hover:bg-blue-600 text-amber-300 hover:text-white border border-slate-700 font-mono font-bold text-[10px]">
                        ${c}
                    </button>
                `).join('');
            }
        }

        function handleSearch() {
            const inputEl = document.getElementById('searchInput');
            const query = inputEl.value.trim().toUpperCase();
            const stateFilter = document.getElementById('stateSelect').value;
            const clearBtn = document.getElementById('clearSearchBtn');
            const quickCard = document.getElementById('quickResultCard');

            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
                lastAnnouncedCode = "";
            }

            const filtered = ROUTING_DATA.filter(item => {
                const matchesQuery = !query || 
                    item.code.toUpperCase().includes(query) ||
                    item.city.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(query.normalize("NFD").replace(/[\u0300-\u036f]/g, "")) ||
                    item.state.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(query.normalize("NFD").replace(/[\u0300-\u036f]/g, "")) ||
                    item.uf.toUpperCase() === query ||
                    item.hub.toUpperCase().includes(query);

                const matchesHub = (selectedHub === 'ALL') || (item.hubCode === selectedHub);
                const matchesState = (stateFilter === 'ALL') || (item.uf === stateFilter);

                return matchesQuery && matchesHub && matchesState;
            });

            const exactMatches = ROUTING_DATA.filter(item => item.code.toUpperCase() === query);

            if (exactMatches.length > 0 && query.length >= 2) {
                const primaryMatch = exactMatches[0];
                const bannerTheme = HUB_BANNER_STYLES[primaryMatch.hubCode] || "bg-gradient-to-r from-blue-600 to-indigo-600 border-white/20";
                
                const hubsList = exactMatches.map(m => `<span class="bg-white text-slate-900 font-black px-2.5 py-1 rounded-lg text-base sm:text-lg shadow inline-flex items-center gap-1.5"><i class="fa-solid fa-plane-arrival text-xs"></i> ${m.hub}</span>`).join(' <span class="text-[11px] opacity-80">ou</span> ');

                quickCard.className = `max-w-xl mx-auto mt-2 p-3 sm:p-4 rounded-xl text-white shadow-xl text-left border-2 transition-all duration-200 ${bannerTheme}`;
                quickCard.innerHTML = `
                    <div class="flex items-center justify-between border-b border-white/25 pb-1.5 mb-2 gap-2">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="text-xl sm:text-2xl font-black font-mono tracking-wider bg-black/25 px-2.5 py-0.5 rounded-lg border border-white/30">${primaryMatch.code}</span>
                            <span class="text-[11px] font-black uppercase bg-black/25 px-2 py-0.5 rounded">${primaryMatch.uf} - ${primaryMatch.state}</span>
                        </div>
                        <span class="text-[11px] font-bold opacity-95 text-right truncate"><i class="fa-solid fa-location-dot"></i> ${primaryMatch.city}</span>
                    </div>
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <span class="text-[10px] uppercase font-extrabold tracking-wider text-white/90">
                            <i class="fa-solid fa-arrow-right"></i> VAI PARA:
                        </span>
                        <div class="flex flex-wrap items-center gap-1.5">
                            ${hubsList}
                        </div>
                    </div>
                `;
                quickCard.classList.remove('hidden');

                if (lastAnnouncedCode !== query) {
                    lastAnnouncedCode = query;
                    playFeedback('success');
                    addRecentSearch(query);

                    if (query.length === 3 && document.getElementById('autoSelectToggle').checked) {
                        setTimeout(() => {
                            inputEl.select();
                        }, 150);
                    }
                }
            } else {
                quickCard.classList.add('hidden');
                if (query.length === 3 && filtered.length === 0 && lastAnnouncedCode !== `ERR_${query}`) {
                    lastAnnouncedCode = `ERR_${query}`;
                    playFeedback('error');
                    if (document.getElementById('autoSelectToggle').checked) {
                        setTimeout(() => {
                            inputEl.select();
                        }, 150);
                    }
                }
            }

            renderResults(filtered, query);
        }

        // Compact Card Layout optimized for mobile screens
        function renderResults(data = ROUTING_DATA, query = '') {
            const grid = document.getElementById('resultsGrid');
            const emptyState = document.getElementById('emptyState');
            const resultsCount = document.getElementById('resultsCount');

            resultsCount.textContent = data.length;

            if (data.length === 0) {
                grid.innerHTML = '';
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                document.getElementById('emptySearchTerm').textContent = query || selectedHub;
                return;
            }

            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');

            grid.innerHTML = data.map(item => {
                const hubBadgeClass = HUB_COLORS[item.hubCode] || "bg-slate-700 text-slate-300";

                return `
                <div class="bg-slate-800 rounded-xl p-3 shadow border border-slate-700/80 hover:border-blue-500/60 transition-all flex flex-col justify-between gap-2">
                    
                    <!-- Top Line: Sigla + UF + Copy Button -->
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 rounded-lg bg-slate-900 text-blue-400 font-mono font-black text-base sm:text-lg tracking-wider border border-slate-700">
                                ${item.code}
                            </span>
                            <span class="px-2 py-0.5 rounded text-xs font-extrabold bg-slate-700 text-slate-200 border border-slate-600">
                                ${item.uf}
                            </span>
                        </div>

                        <button 
                            onclick="copyToClipboard('${item.code}', '${item.city}', '${item.state}', '${item.uf}', '${item.hub}')" 
                            title="Copiar" 
                            class="px-2 py-1 rounded-lg bg-slate-700/80 text-slate-300 hover:text-blue-400 hover:bg-slate-700 transition-colors flex items-center gap-1 font-semibold text-[11px]">
                            <i class="fa-regular fa-copy"></i>
                            <span class="hidden sm:inline">Copiar</span>
                        </button>
                    </div>

                    <!-- City & State Line -->
                    <div class="text-xs leading-tight">
                        <span class="font-bold text-slate-100">${item.city}</span>
                        <span class="text-slate-400"> &bull; ${item.state}</span>
                    </div>

                    <!-- Destination Box (Compact) -->
                    <div class="px-2.5 py-1.5 rounded-lg bg-slate-900/90 border border-slate-700/80 flex items-center justify-between gap-2">
                        <span class="text-[10px] font-extrabold uppercase tracking-wider text-blue-400 shrink-0">
                            DESTINO:
                        </span>
                        <span class="text-xs font-black ${hubBadgeClass} px-2 py-0.5 rounded border truncate">
                            ${item.hub}
                        </span>
                    </div>

                </div>
                `;
            }).join('');
        }

        function buildModalContent() {
            const container = document.getElementById('modalGroupContent');
            const hubs = [
                { name: "GUARULHOS – GRU", code: "GRU" },
                { name: "CONGONHAS – CGH", code: "CGH" },
                { name: "PORTO ALEGRE – POA", code: "POA" },
                { name: "CONFINS – CNF", code: "CNF" },
                { name: "CAMPINAS – VCP", code: "VCP" }
            ];

            container.innerHTML = hubs.map(hub => {
                const items = ROUTING_DATA.filter(i => i.hubCode === hub.code);
                return `
                <div class="bg-slate-900/70 p-3.5 rounded-xl border border-slate-700">
                    <div class="flex items-center justify-between mb-2.5 border-b border-slate-700 pb-1.5">
                        <h4 class="font-extrabold text-xs sm:text-sm text-white flex items-center gap-1.5">
                            <i class="fa-solid fa-plane text-blue-500"></i> ${hub.name}
                        </h4>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-blue-900/50 text-blue-300">
                            ${items.length}
                        </span>
                    </div>

                    <div class="flex flex-wrap gap-1.5">
                        ${items.map(item => `
                            <button onclick="closeModal(); setSearch('${item.code}');" class="flex items-center gap-1 px-2 py-1 bg-slate-800 hover:bg-blue-600 text-white rounded-lg border border-slate-700 transition-colors">
                                <span class="font-mono font-black text-xs">${item.code}</span>
                                <span class="text-[10px] text-slate-400">(${item.uf})</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
                `;
            }).join('');
        }

        function copyToClipboard(code, city, state, uf, hub) {
            const textToCopy = `Sigla: ${code} | Cidade: ${city} | Estado: ${state} (${uf}) | Roteirização: ${hub}`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => showToast(code, uf));
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(code, uf);
            }
        }

        function showToast(code, uf) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = `Sigla ${code} (${uf}) copiada!`;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2200);
        }

        function openModal() {
            buildModalContent();
            document.getElementById('listModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('listModal').classList.add('hidden');
        }

        function showCustomToast(msg) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2200);
        }
    </script>
